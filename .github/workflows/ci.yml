name: CI
on: workflow_dispatch
permissions:
  contents: read
jobs:
  windows-readiness:
    runs-on: windows-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: 7024cd4c71f518ffb3261a3a7ab5b6d267e46e6d
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.22.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run server/antigravity-account-api.test.ts server/browser-live-routes.test.ts server/cloud-sync.e2e.test.ts
        env:
          OMB_VITEST_WORKERS: 2
