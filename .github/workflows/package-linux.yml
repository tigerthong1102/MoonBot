name: Verify Vietnamese iOS tests on the current PR on an Intel runner
on: workflow_dispatch
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-26-intel
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 3e01f3bb40f50537aa43d3a38444a091b45605a7
          persist-credentials: false
      - name: Check the phone protocol
        run: swift test --package-path ios
      - name: Generate the app and test it on an iPhone simulator
        working-directory: ios
        run: |
          command -v xcodegen || brew install xcodegen
          xcodegen generate
          read -r device runtime <<< "$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["deviceTypeIdentifier"]+" "+k for k,ds in sorted(json.load(sys.stdin)["devices"].items(),reverse=True) if ".iOS-" in k for d in ds if d["name"].startswith("iPhone")))')"
          simulator=$(xcrun simctl create StartupBot-Vietnamese "$device" "$runtime")
          xcrun simctl boot "$simulator"
          xcodebuild test -project StartupBot.xcodeproj -scheme StartupBot \
            -destination "platform=iOS Simulator,id=$simulator" -parallel-testing-enabled NO \
            -only-testing:StartupBotUITests/VietnameseOnboardingTests -only-testing:StartupBotAppTests/VietnameseMessageTests CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM=
