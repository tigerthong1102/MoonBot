name: Accept existing internal macOS arm64 installer
on: workflow_dispatch
permissions:
  contents: read
  actions: read
jobs:
  smoke:
    runs-on: macos-15
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: daa78f874fb091b847b1270efbdbc410fbc6d133
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify and run the downloaded Apple Silicon installer
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          sha=daa78f874fb091b847b1270efbdbc410fbc6d133
          gh run download 44346930538 -R tigerthong1102/MoonBot -n "StartupBot-macOS-arm64-INTERNAL-$sha-1" -D "$RUNNER_TEMP/artifact"
          cd "$RUNNER_TEMP/artifact"
          test "$(jq -r '.commit' build-metadata.json)" = "$sha"
          shasum -a 256 -c SHA256SUMS.txt
          volume="$RUNNER_TEMP/volume"
          mkdir "$volume"
          hdiutil attach -readonly -nobrowse -mountpoint "$volume" ./*-arm64.dmg
          trap 'hdiutil detach "$volume"' EXIT
          ditto "$volume/StartupBot.app" "$RUNNER_TEMP/StartupBot.app"
          codesign --verify --deep --strict "$RUNNER_TEMP/StartupBot.app"
          cd "$GITHUB_WORKSPACE"
          node scripts/smoke-internal-desktop.mjs --app "$RUNNER_TEMP/StartupBot.app" --output "$RUNNER_TEMP/smoke"
          cat "$RUNNER_TEMP/smoke/chromium-network.json"
