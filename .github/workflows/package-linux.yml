name: Inspect pinned Windows CUA artifact on hosted runner
on: workflow_dispatch
permissions:
  contents: read
jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - name: Check official archive, extracted file, and Windows security events
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $start = Get-Date
          $dir = Join-Path $env:RUNNER_TEMP 'startupbot-cua-review'
          New-Item -Path $dir -ItemType Directory | Out-Null
          $archive = Join-Path $dir 'official.zip'
          $exe = Join-Path $dir 'cua-driver.exe'
          $url = 'https://github.com/trycua/cua/releases/download/cua-driver-rs-v0.45.4/cua-driver-rs-0.45.4-windows-x86_64-binary.zip'
          Invoke-WebRequest -Uri $url -OutFile $archive
          $digest = (Get-FileHash -Algorithm SHA256 -Path $archive).Hash
          if ($digest -ne '949927b4cb0519c6fb1377878d67d79a8d6fae7bc56cbed17c7aa26448d82cb5') { throw 'Official archive SHA-256 mismatch' }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead($archive)
          try { $zip.Entries | Select-Object FullName,Length | Format-Table } finally { $zip.Dispose() }
          try {
            powershell.exe -NoProfile -NonInteractive -Command "Expand-Archive -LiteralPath '$archive' -DestinationPath '$dir' -ErrorAction Stop"
            if ($LASTEXITCODE -ne 0) { throw "Expand-Archive exit code $LASTEXITCODE" }
            if (!(Test-Path -LiteralPath $exe)) { throw 'Expected executable missing immediately after extraction' }
            Get-Item -LiteralPath $exe | Select-Object Name,Length
            Get-FileHash -Algorithm SHA256 $exe
            $version = & $exe --version 2>&1
            Write-Host "Version command exit $LASTEXITCODE. Output: $version"
            if ($LASTEXITCODE -ne 0 -or "$version" -notmatch 'cua-driver\s+0\.45\.4\b') { throw 'Required CUA version not confirmed' }
          } finally {
            Start-Sleep -Seconds 3
            Write-Host "Expected executable still present: $(Test-Path -LiteralPath $exe)"
            $events = Get-WinEvent -FilterHashtable @{LogName='Microsoft-Windows-Windows Defender/Operational';Id=1116,1117;StartTime=$start} -ErrorAction SilentlyContinue
            foreach ($event in $events) {
              if ($event.Message -match 'startupbot-cua-review|cua-driver') {
                $details = ([xml]$event.ToXml()).Event.EventData.Data
                $threat = ($details | Where-Object Name -eq 'Threat Name').'#text'
                Write-Host "Defender CUA event $($event.Id); detection $threat"
              }
            }
          }
