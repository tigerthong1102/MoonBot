name: Internal package verification

on:
  workflow_dispatch:
    inputs:
      desktop:
        description: "Build StartupBot internal macOS and Windows installers instead of Ubuntu"
        required: false
        type: boolean
        default: false
      desktop_os:
        description: "Internal desktop platform to build"
        required: false
        type: choice
        options: [all, macos, windows]
        default: all
      ref:
        description: "Commit/tag/branch to build (defaults to the branch this is run from)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  package:
    if: ${{ !inputs.desktop }}
    name: DEB + AppImage (Ubuntu 24.04 x64)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install package validation and native smoke tools
        run: >-
          sudo apt-get update && sudo apt-get install -y
          at-spi2-core dbus-x11 desktop-file-utils libxi6 libxkbcommon0 openbox squashfs-tools x11-utils xdotool xvfb
      - run: pnpm install --frozen-lockfile
      - name: Clean generated output
        run: pnpm clean
      - name: Stage the pinned CUA runtime
        run: pnpm build:cua:linux
      - name: Prove overlay-free X11 input routing
        run: dbus-run-session -- xvfb-run -a pnpm smoke:cua-x11-input
      - name: Package from the verified offline CUA stage
        run: pnpm package:linux:offline
      - name: Verify package contents and metadata
        run: node scripts/verify-linux-package.mjs
      - name: Match a normal Ubuntu package parent on the ephemeral runner
        run: |
          test ! -L /opt
          test "$(stat -c '%F %U:%G' /opt)" = "directory root:root"
          case "$(stat -c '%a' /opt)" in
            755) ;;
            775|777) sudo chmod 0755 /opt ;;
            *) echo "Unexpected /opt mode: $(stat -c '%a' /opt)" >&2; exit 1 ;;
          esac
          test "$(stat -c '%U:%G %a' /opt)" = "root:root 755"
      - name: Reproduce and verify an in-place DEB upgrade
        run: |
          deb=(release/*.deb)
          test "${#deb[@]}" -eq 1
          sudo --preserve-env=CI,RUNNER_TEMP node scripts/smoke-deb-upgrade.mjs "${deb[0]}"
      - name: Prove the handed-over Ubuntu command installs
        # The .deb path ends with a command on the user's clipboard, so the
        # command is the deliverable. Runs it as root on a clean Ubuntu through
        # a real shell, and checks that the `dpkg -i` it replaced still fails
        # there — the reason the app must not run that itself.
        run: |
          deb=(release/*.deb)
          test "${#deb[@]}" -eq 1
          pnpm smoke:deb-command "${deb[0]}"
      - name: Prove an AppImage update lands on the launched path
        # Installs the current published release over a copy named after a
        # version, which is the shape that used to orphan the launcher. Runs
        # against the real feed, so it also covers the differential download.
        run: pnpm smoke:linux-update
      - name: Configure Chromium sandbox for the unpacked app
        run: |
          sudo chown root:root release/linux-unpacked/chrome-sandbox
          sudo chmod 4755 release/linux-unpacked/chrome-sandbox
          test "$(stat -c '%U:%G %a' release/linux-unpacked/chrome-sandbox)" = "root:root 4755"
      - name: Verify the installed browser with Ubuntu sandbox restrictions
        run: node scripts/smoke-browser-bundle.mjs --resources /opt/StartupBot/resources
      - name: Launch packaged app and verify lifecycle
        env:
          OMB_KEEP_SMOKE_DIR: "1"
          OMB_SMOKE_INSTALLED_DEB: "1"
        run: pnpm smoke:linux-package
      - name: Remove the installed upgrade fixture
        if: always()
        run: sudo dpkg --purge openmausbot || true
      - name: Prepare release assets
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          appimage="release/OpenMausBot-${version}-x86_64.AppImage"
          deb="release/OpenMausBot-${version}-amd64.deb"
          test -f "$appimage"
          test -f "$deb"
          cp "$appimage" release/OpenMausBot.AppImage
          cp "$deb" release/OpenMausBot-amd64.deb
          chmod 0755 release/OpenMausBot.AppImage
          (
            cd release
            sha256sum \
              "$(basename "$appimage")" \
              "$(basename "$deb")" \
              OpenMausBot.AppImage \
              OpenMausBot-amd64.deb > SHA256SUMS-ubuntu-x64.txt
          )
          echo "artifact-name=openmausbot-ubuntu-${version}-x64" >> "$GITHUB_OUTPUT"
          echo "version: $version"
          echo "commit:  $(git rev-parse HEAD)"
          cat release/SHA256SUMS-ubuntu-x64.txt
      - name: Upload smoke diagnostics on failure
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: openmausbot-ubuntu-smoke-diagnostics
          path: |
            /tmp/omb-linux-smoke-*
            /tmp/omb-linux-smoke-runtime-*
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.release.outputs.artifact-name }}
          path: |
            release/OpenMausBot-*-amd64.deb
            release/OpenMausBot-*-x86_64.AppImage
            release/OpenMausBot-amd64.deb
            release/OpenMausBot.AppImage
            release/SHA256SUMS-ubuntu-x64.txt
          if-no-files-found: error
          retention-days: 14

  macos:
    if: inputs.desktop && (inputs.desktop_os == 'all' || inputs.desktop_os == 'macos')
    name: StartupBot macOS internal DMGs
    runs-on: macos-26-intel
    timeout-minutes: 60
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify StartupBot branding and native icon assets
        run: pnpm exec vitest run scripts/startupbot-branding.test.mjs scripts/startupbot-runtime-branding.test.ts scripts/internal-package.test.ts server/phone-secret.test.ts companion/test/phone-secret-key.test.ts
      - run: pnpm package:prepare
      - run: pnpm build:speech && pnpm build:cua
      - run: pnpm exec electron-builder --config electron-builder.internal.yml --mac dmg --arm64 --x64 --publish never
      - name: Test the installed Intel DMG on its native host
        shell: bash
        run: |
          set -euo pipefail
          volume="$RUNNER_TEMP/StartupBotVolume"
          mkdir -p "$volume" "$RUNNER_TEMP/StartupBotInstalled"
          hdiutil attach -nobrowse -readonly -mountpoint "$volume" release/internal/*-x64.dmg
          trap 'hdiutil detach "$volume"' EXIT
          ditto "$volume/StartupBot.app" "$RUNNER_TEMP/StartupBotInstalled/StartupBot.app"
          codesign --verify --deep --strict "$RUNNER_TEMP/StartupBotInstalled/StartupBot.app"
          node scripts/smoke-internal-desktop.mjs --app "$RUNNER_TEMP/StartupBotInstalled/StartupBot.app" --output release/internal/smoke
      - name: Test the packaged browser and server
        env:
          OMB_SMOKE_DIST: ${{ github.workspace }}/release/internal/mac/StartupBot.app/Contents/Resources/server
        run: |
          node scripts/smoke-browser-bundle.mjs --resources "$PWD/release/internal/mac/StartupBot.app/Contents/Resources"
          node scripts/smoke-packaged-server.mjs --browser-bundle "$PWD/release/internal/mac/StartupBot.app/Contents/Resources/browser-engine"
      - run: node scripts/internal-build-metadata.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: StartupBot-macOS-INTERNAL-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            release/internal/*.dmg
            release/internal/SHA256SUMS.txt
            release/internal/build-metadata.json
            release/internal/smoke/
            docs/STARTUPBOT_INTERNAL_TEST.md
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: failure()
        with:
          name: StartupBot-macOS-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: release/internal/smoke/
          retention-days: 7

  windows:
    if: inputs.desktop && (inputs.desktop_os == 'all' || inputs.desktop_os == 'windows')
    name: StartupBot Windows internal EXE
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify StartupBot branding and native icon assets
        run: pnpm exec vitest run scripts/startupbot-branding.test.mjs scripts/startupbot-runtime-branding.test.ts scripts/internal-package.test.ts server/phone-secret.test.ts companion/test/phone-secret-key.test.ts
      - run: pnpm package:prepare
      - run: pnpm build:cua:win
      - run: pnpm exec electron-builder --config electron-builder.internal.yml --win nsis --x64 --publish never
      - name: Install EXE and test the installed application
        shell: pwsh
        run: |
          $installer = @(Get-ChildItem release/internal/*-Setup.exe)
          if ($installer.Count -ne 1) { throw 'Expected exactly one StartupBot installer' }
          $destination = Join-Path $env:RUNNER_TEMP 'StartupBotInstalled'
          $install = Start-Process -FilePath $installer[0].FullName -ArgumentList '/S', "/D=$destination" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer failed: $($install.ExitCode)" }
          node scripts/smoke-internal-desktop.mjs --app "$destination/StartupBot.exe" --output release/internal/smoke
          if ($LASTEXITCODE -ne 0) { throw 'Installed application smoke failed' }
      - name: Test the packaged browser and server
        env:
          OMB_SMOKE_DIST: ${{ github.workspace }}/release/internal/win-unpacked/resources/server
        run: |
          node scripts/smoke-browser-bundle.mjs --resources "$env:GITHUB_WORKSPACE/release/internal/win-unpacked/resources"
          if ($LASTEXITCODE -ne 0) { throw 'Packaged browser smoke failed' }
          node scripts/smoke-packaged-server.mjs --browser-bundle "$env:GITHUB_WORKSPACE/release/internal/win-unpacked/resources/browser-engine"
          if ($LASTEXITCODE -ne 0) { throw 'Packaged server smoke failed' }
      - run: node scripts/internal-build-metadata.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: StartupBot-Windows-INTERNAL-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            release/internal/*-Setup.exe
            release/internal/SHA256SUMS.txt
            release/internal/build-metadata.json
            release/internal/smoke/
            docs/STARTUPBOT_INTERNAL_TEST.md
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: failure()
        with:
          name: StartupBot-Windows-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: release/internal/smoke/
          retention-days: 7
