name: Package StartupBot pilot

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Platform to build"
        type: choice
        default: all
        options: [all, windows, android, ios]
      origin:
        description: "HTTPS Inbox origin"
        required: true
        type: string
      artifact_public_key:
        description: "Base64 PEM public key for the pilot artifacts"
        required: true
        type: string

permissions:
  contents: read

env:
  STARTUPBOT_INBOX_ORIGIN: ${{ inputs.origin }}
  PILOT_ARTIFACT_PUBLIC_KEY: ${{ inputs.artifact_public_key }}

jobs:
  windows:
    if: inputs.target == 'all' || inputs.target == 'windows'
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm
      - run: node scripts/validate-pilot-origin.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm package:prepare
      - run: pnpm build:cua:win
      - name: Package Windows
        shell: bash
        run: pnpm exec electron-builder --config electron-builder.internal.yml --win nsis --x64 --publish never -c.compression=normal "-c.extraMetadata.startupbotInboxOrigin=$STARTUPBOT_INBOX_ORIGIN"
      - name: Install and open the Windows package
        shell: pwsh
        run: |
          $installer = Get-ChildItem release/internal -Filter '*Setup*.exe' -File | Select-Object -First 1
          $target = Join-Path $env:RUNNER_TEMP 'startupbot-pilot-installed'
          if ((Start-Process $installer.FullName -ArgumentList @('/S', "/D=$target") -PassThru -Wait).ExitCode -ne 0) { throw 'NSIS install failed' }
          $application = Join-Path $target 'StartupBot.exe'
          if (-not (Test-Path $application)) { throw 'StartupBot.exe was not installed' }
          $env:OMB_SMOKE_TEST = '1'
          $env:OMB_SMOKE_KEEP_OPEN = '1'
          $env:OMB_SMOKE_CUA = '0'
          $env:OMB_SMOKE_HOME = Join-Path $env:RUNNER_TEMP 'pilot-home'
          New-Item -ItemType Directory -Path $env:OMB_SMOKE_HOME -Force | Out-Null
          $env:OMB_DATA_DIR = Join-Path $env:RUNNER_TEMP 'pilot-data'
          $env:OMB_PORT = '25380'
          $env:OMB_WEBHOOK_PORT = '25381'
          $env:OMB_COMPANION_BONJOUR = '0'
          $profile = Join-Path $env:RUNNER_TEMP 'pilot-profile'
          Remove-Item Env:STARTUPBOT_INBOX_ORIGIN
          $stdout = Join-Path $env:RUNNER_TEMP 'pilot-desktop-stdout.txt'
          $stderr = Join-Path $env:RUNNER_TEMP 'pilot-desktop-stderr.txt'
          $process = Start-Process $application -ArgumentList @("--user-data-dir=$profile", '--remote-debugging-port=25382') -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          try {
            node scripts/smoke-pilot-desktop.mjs
            if ($LASTEXITCODE -ne 0) {
              Get-Content $stdout,$stderr -Tail 50 -ErrorAction SilentlyContinue
              Get-Content (Join-Path $env:APPDATA 'StartupBot/logs/server.log') -Tail 50 -ErrorAction SilentlyContinue
              throw 'Windows package UI smoke failed'
            }
          } finally {
            Stop-Process -Id $process.Id -ErrorAction SilentlyContinue
          }
      - name: Encrypt the installer
        shell: bash
        run: bash scripts/encrypt-pilot-package.sh release/internal/*Setup*.exe windows
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: startupbot-1.0.1-pilot-windows
          path: pilot-artifacts/windows/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  android:
    if: inputs.target == 'all' || inputs.target == 'android'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: node scripts/validate-pilot-origin.mjs
      - name: Build Android APK
        working-directory: android
        run: JAVA_HOME="$JAVA_HOME_17_X64" ./gradlew :app:assembleDebug
      - name: Install and open the exact APK
        shell: bash
        run: bash scripts/smoke-pilot-android.sh
      - name: Encrypt the Android APK
        run: bash scripts/encrypt-pilot-package.sh android/app/build/outputs/apk/debug/*universal*.apk android
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: startupbot-1.0.1-pilot-android
          path: pilot-artifacts/android/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  ios:
    if: inputs.target == 'all' || inputs.target == 'ios'
    runs-on: macos-26-intel
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: node scripts/validate-pilot-origin.mjs
      - name: Build and install the iOS Simulator app
        working-directory: ios
        run: |
          command -v xcodegen || brew install xcodegen
          xcodegen generate
          read -r device runtime <<< "$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["deviceTypeIdentifier"]+" "+k for k,ds in sorted(json.load(sys.stdin)["devices"].items(),reverse=True) if ".iOS-" in k for d in ds if d["name"].startswith("iPhone")))')"
          simulator=$(xcrun simctl create StartupBot-Inbox-Pilot "$device" "$runtime")
          xcrun simctl boot "$simulator"
          xcodebuild -project StartupBot.xcodeproj -scheme StartupBot -configuration Debug             -destination "platform=iOS Simulator,id=$simulator" -derivedDataPath "$RUNNER_TEMP/startupbot-derived"             STARTUPBOT_INBOX_ORIGIN="$STARTUPBOT_INBOX_ORIGIN" ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= build -quiet
          app="$RUNNER_TEMP/startupbot-derived/Build/Products/Debug-iphonesimulator/StartupBot.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print StartupBotInboxOrigin' "$app/Info.plist")" = "$STARTUPBOT_INBOX_ORIGIN"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$app/Info.plist")" = 1.0.1
          xcrun lipo -verify_arch arm64 x86_64 "$app/StartupBot"
          xcrun simctl bootstatus "$simulator" -b
          xcrun simctl install "$simulator" "$app"
          xcrun simctl launch "$simulator" ai.startupbot.ios
          sleep 3
          xcrun simctl io "$simulator" screenshot "$RUNNER_TEMP/ios-pilot.png"
          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/StartupBot-1.0.1-iOS-Simulator.zip"
      - name: Encrypt the iOS Simulator archive
        run: bash scripts/encrypt-pilot-package.sh "$RUNNER_TEMP/StartupBot-1.0.1-iOS-Simulator.zip" ios
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: startupbot-1.0.1-pilot-ios-simulator
          path: pilot-artifacts/ios/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
