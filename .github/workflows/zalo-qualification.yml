name: Zalo offline qualification
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/qualification/zalo-personal/**'
      - 'scripts/qualification/zalo-official/**'
      - 'server/zalo-*'
      - 'server/routes/zalo-*'
      - 'src/components/Zalo*'
      - 'shared/zalo-pairing.ts'
      - 'shared/zalo-event.ts'
      - 'electron/secure-credentials.mjs'
      - '.github/workflows/zalo-qualification.yml'
permissions:
  contents: read
jobs:
  lab:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26.4.0'
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec vitest run server/zalo-official-roundtrip.test.ts server/routes/zalo-pairing.test.ts src/components/ZaloPairingSetup.dom.test.ts
      - working-directory: scripts/qualification/zalo-personal
        run: npm ci --ignore-scripts
      - working-directory: scripts/qualification/zalo-personal
        run: npm test
      - working-directory: scripts/qualification/zalo-personal
        run: npm run test:integration
