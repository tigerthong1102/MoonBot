<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>StartupBot</title><link rel="stylesheet" href="/mobile/skin.css"><link rel="stylesheet" href="/mobile/inbox-select.css"><style>
:root{color-scheme:light dark;font-family:var(--font-sans)}*{box-sizing:border-box}[hidden]{display:none!important}body{font-size:.8125rem;line-height:1.125rem;background:var(--color-app);color:var(--color-ink);margin:0 auto;max-width:45rem;padding:max(1rem,env(safe-area-inset-top)) 1rem max(1.5rem,env(safe-area-inset-bottom))}h1{font-size:1.25rem;line-height:1.5rem;font-weight:600;letter-spacing:-.01em;margin:0 0 1.2rem}form,section,article{margin:1rem 0}label{display:block}textarea,input,select{font:inherit;padding:.65rem;border-radius:.55rem;border:1px solid var(--color-hairline)}textarea,input:not([type=checkbox]),[data-inbox-select]{width:100%;margin:.3rem 0 .65rem}textarea{resize:vertical}button{font-family:inherit;cursor:pointer}button:disabled{cursor:default}.ui-button-primary{background:var(--color-ink);color:var(--color-app)}p,article{overflow-wrap:anywhere;white-space:pre-wrap}article{border-inline-start:3px solid var(--color-hairline);padding-inline-start:.8rem}pre{white-space:pre-wrap;overflow-wrap:anywhere}article p{margin:.35rem 0;font-size:.9375rem;line-height:1.375rem}pre,code{font-family:var(--font-mono)}.controls{display:flex;gap:.5rem;flex-wrap:wrap}header{display:flex;justify-content:space-between;align-items:baseline}.sr{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip-path:inset(50%)}#status:empty{display:none}#status{padding:.7rem;border:1px solid var(--color-hairline)}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--color-focus)}label:has(input[type=checkbox]){margin:.6rem 0}
@media (pointer:coarse){.ui-button,[data-inbox-select] select,label:has(input[type=checkbox]){min-height:44px}label:has(input[type=checkbox]){display:flex;align-items:center;gap:.4rem}}
</style></head><body><header><h1>StartupBot</h1><button class="ui-button" hidden id="logout" data-t="logout"></button></header>
<main><a id="startupRetry" href="/mobile"><!--mobile-retry-label--></a><form id="login" hidden>
<label for="email" data-t="email"></label><input type="email" id="email" autocomplete="email" required maxlength="254">
<div id="codeBox" hidden><label for="otp" data-t="otp"></label><input id="otp" inputmode="numeric" pattern="[0-9]{8}" maxlength="8" autocomplete="one-time-code"></div>
<button class="ui-button ui-button-pill ui-button-primary" id="loginButton" data-t="code"></button> <button class="ui-button" type="button" id="changeEmail" hidden data-t="change"></button></form>
<section id="chat" hidden><label for="threads" data-t="history"></label><inbox-select id="threads"></inbox-select>
<div class="controls"><button class="ui-button" id="new" data-t="new"></button><button class="ui-button" id="rename" data-t="rename"></button><button class="ui-button" id="remove" data-t="remove"></button></div>
<details id="devices"><summary data-t="devices"></summary><p data-t="deviceNote"></p><ul id="deviceList"></ul></details>
<details id="providers" hidden><summary data-t="providers"></summary><p data-t="providerNote"></p><div class="controls"><button class="ui-button" id="connectProvider" data-t="connectProvider"></button><button class="ui-button" id="disconnectProvider" data-t="disconnectProvider"></button><a id="providerKeys" rel="noreferrer" target="_blank" href="https://openrouter.ai/keys" data-t="providerKeys"></a></div></details>
<button class="ui-button" hidden id="older" data-t="older"></button><section id="transcript" data-t-label="transcript"></section>
<form id="compose"><div id="billing" hidden><label for="provider" data-t="billing"></label><inbox-select id="provider"><option value="managed" data-t="managed"></option><option value="openrouter" data-t="personal"></option></inbox-select></div><label for="skill" data-t="skill"></label><inbox-select id="skill"><option value="chat" data-t="ask"></option><option value="write" data-t="write"></option><option value="translate" data-t="translate"></option><option value="summarize" data-t="summarize"></option><option value="campaign-plan" data-t="campaign"></option><option value="draft-outreach" data-t="outreach"></option><option value="desktop" data-t="desktop"></option></inbox-select><label for="prompt" data-t="message"></label><textarea dir="auto" id="prompt" rows="3" required maxlength="8192"></textarea>
<label><input type="checkbox" id="consent" required> <span data-t="consent"></span></label>
<button class="ui-button ui-button-pill ui-button-primary" id="send" data-t="send"></button> <button class="ui-button" type="button" id="stop" hidden data-t="stop"></button>
</form></section><button class="ui-button" hidden id="retry" data-t="retry"></button><p id="status" aria-hidden="true"></p><div class="sr" id="announcement" role="status" aria-live="polite" aria-atomic="true" dir="auto"></div></main>
<script id="mobileCatalog" type="application/json"><!--mobile-catalog--></script>
<script type="module" src="/mobile/app.js"></script></body></html>
