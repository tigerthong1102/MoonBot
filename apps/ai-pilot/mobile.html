<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>StartupBot</title><link rel="stylesheet" href="/mobile/skin.css"><link rel="stylesheet" href="/mobile/inbox.css">
<style>
#chat{display:flex;flex:1;min-height:0;flex-direction:column}#history{min-height:5rem}#login{width:min(440px,94%);margin:5vh auto;padding:1rem;overflow:auto}
#tools{max-height:45dvh;overflow:auto;padding:.3rem 1rem;border-bottom:1px solid var(--color-hairline)}#tools summary{padding:.6rem 0}
.controls{display:flex;flex-wrap:wrap;gap:.4rem}#compose{padding-bottom:max(.7rem,env(safe-area-inset-bottom));overflow:auto}
#prompt{flex:1;min-width:0;border:0;background:transparent;resize:vertical;font-size:max(16px,1rem)}
#compose label:has(#consent){display:flex;align-items:flex-start}#send,#stop{min-height:44px}
#posts pre{white-space:pre-wrap;overflow-wrap:anywhere}header #logout{margin-inline-start:auto}#status{overflow-wrap:anywhere}
</style></head><body><header><b>StartupBot</b><button class="ui-button" hidden id="logout" data-t="logout"></button></header>
<main><form id="login" hidden>
<label for="email" data-t="email"></label><input type="email" id="email" autocomplete="email" required maxlength="254">
<div id="codeBox" hidden><label for="otp" data-t="otp"></label><input id="otp" inputmode="numeric" pattern="[0-9]{8}" maxlength="8" autocomplete="one-time-code"></div>
<button class="ui-button" id="loginButton" data-t="code"></button> <button type="button" id="changeEmail" hidden data-t="change"></button></form>
<section id="chat" hidden><details id="tools"><summary data-t="history"></summary><label class="sr" for="threads" data-t="history"></label><select id="threads"></select>
<div class="controls"><button id="new" data-t="new"></button><button id="rename" data-t="rename"></button><button id="remove" data-t="remove"></button></div>
<details id="usage"><summary data-t="usage"></summary><p id="usageText"></p></details>
<details id="sessions"><summary data-t="sessions"></summary><ul id="sessionList"></ul><button id="logoutAll" data-t="logoutAll"></button></details>
<details id="devices"><summary data-t="devices"></summary><p data-t="deviceNote"></p><ul id="deviceList"></ul></details>
<details id="providers" hidden><summary data-t="providers"></summary><p data-t="providerNote"></p><div class="controls"><button id="connectProvider" data-t="connectProvider"></button><button id="disconnectProvider" data-t="disconnectProvider"></button><a id="providerKeys" rel="noreferrer" target="_blank" href="https://openrouter.ai/keys" data-t="providerKeys"></a></div></details>
</details><div id="history"><button hidden id="older" data-t="older"></button><div id="posts"><section id="transcript" data-t-label="transcript" style="display:contents"></section></div></div>
<form id="compose"><details id="skills"><summary data-t="skill"></summary><div id="billing" hidden><label for="provider" data-t="billing"></label><select id="provider"><option value="managed" data-t="managed"></option><option value="openrouter" data-t="personal"></option></select></div><label for="skill" data-t="skill"></label><select id="skill"><option value="chat" data-t="ask"></option><option value="write" data-t="write"></option><option value="translate" data-t="translate"></option><option value="summarize" data-t="summarize"></option><option value="campaign-plan" data-t="campaign"></option><option value="draft-outreach" data-t="outreach"></option><option value="desktop" data-t="desktop"></option></select></details><label for="prompt" class="sr" data-t="message"></label>
<label><input type="checkbox" id="consent" required> <span data-t="consent"></span></label>
<div class="compose-row"><div class="draft-field"><textarea dir="auto" id="prompt" rows="1" required maxlength="8192"></textarea></div>
<button id="send" class="ui-button" data-t="send"></button><button type="button" id="stop" hidden class="ui-button" data-t="stop"></button></div>
</form></section><button hidden id="retry" data-t="retry"></button><p id="status" role="status" aria-live="polite"></p></main>
<script type="module" src="/mobile/app.js"></script></body></html>
