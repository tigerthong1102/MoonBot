# Modified for StartupBot; original copyright and license retained.
name: StartupBot
options:
  bundleIdPrefix: ai.startupbot
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "17"

packages:
  CompanionCore:
    path: .

schemes:
  StartupBot:
    build:
      targets:
        StartupBot: all
        StartupBotAppTests: [test]
        StartupBotUITests: [test]
    test:
      config: Debug
      targets:
        - StartupBotAppTests
        - StartupBotUITests

targets:
  StartupBot:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: AppShared
      - path: Shared
    dependencies:
      - package: CompanionCore
        product: CompanionCore
      - target: StartupBotWidgets
      - target: StartupBotShareExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.startupbot.ios
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: App/StartupBot.entitlements
      properties:
        com.apple.security.application-groups:
          - group.ai.startupbot.shared
        keychain-access-groups:
          - $(AppIdentifierPrefix)ai.startupbot.ios
          - $(AppIdentifierPrefix)group.ai.startupbot.shared
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: StartupBot
        StartupBotInboxOrigin: $(STARTUPBOT_INBOX_ORIGIN)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        ITSAppUsesNonExemptEncryption: false
        OpenMausKeychainAccessGroup: $(AppIdentifierPrefix)group.ai.startupbot.shared
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLName: ai.startupbot.companion.pairing
            CFBundleURLSchemes:
              - startupbot
        # iOS uses compatibility scaling when UILaunchScreen is absent.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: >-
          StartupBot finds your computer on this network so your bots can
          reach you here.
        NSCameraUsageDescription: >-
          StartupBot uses the camera only to scan a pairing QR code shown on
          your computer.
        NSMicrophoneUsageDescription: >-
          StartupBot listens while you dictate a message to a bot.
        NSSpeechRecognitionUsageDescription: >-
          StartupBot converts your speech into text so you can send it
          to a bot. Recognition runs on this phone when it can.
        NSBonjourServices:
          - _openmausbot._tcp
        # ATS hostname exceptions cover tailnet MagicDNS; no blanket HTTP exception is permitted.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            ts.net:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true

  StartupBotAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AppTests
    dependencies:
      - target: StartupBot
      - package: CompanionCore
        product: CompanionCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.startupbot.ios.apptests
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/StartupBot.app/StartupBot"
        BUNDLE_LOADER: "$(TEST_HOST)"

  StartupBotUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: StartupBot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.startupbot.ios.uitests
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: StartupBot

  StartupBotShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
      - path: AppShared
    dependencies:
      - package: CompanionCore
        product: CompanionCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.startupbot.ios.share
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: true
    entitlements:
      path: ShareExtension/StartupBotShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.ai.startupbot.shared
        keychain-access-groups:
          - $(AppIdentifierPrefix)group.ai.startupbot.shared
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: StartupBot
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        OpenMausKeychainAccessGroup: $(AppIdentifierPrefix)group.ai.startupbot.shared
        # ATS hostname exceptions cover tailnet MagicDNS; no blanket HTTP exception is permitted.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            ts.net:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 4
              NSExtensionActivationSupportsFileWithMaxCount: 4
              NSExtensionActivationSupportsAttachmentsWithMaxCount: 4

  StartupBotWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Shared
      - path: App/MausAvatar.swift
      - path: App/MausFaceData.swift
    dependencies:
      - package: CompanionCore
        product: CompanionCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.startupbot.ios.widgets
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: true
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: StartupBot
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
